# Perfil MySQL — activo en Docker (SPRING_PROFILES_ACTIVE=mysql)
spring.datasource.url=${DB_COMPRA_URL:jdbc:mysql://localhost:3306/db_compra?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_COMPRA_USER:root}
spring.datasource.password=${DB_COMPRA_PASS:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.h2.console.enabled=false
