# Perfil MySQL — activo en Docker (SPRING_PROFILES_ACTIVE=mysql)
spring.datasource.url=${DB_SNS_URL:jdbc:mysql://localhost:3306/db_sns?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_SNS_USER:root}
spring.datasource.password=${DB_SNS_PASS:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.h2.console.enabled=false
