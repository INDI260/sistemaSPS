# ============================================================
#             CAMBIAR IPs AQUÍ según el entorno
# ============================================================
#   ms-auth:        CAMBIAR IP en el location /api/auth/
#   ms-compra:      CAMBIAR IP en upstream compra_backend
#   ms-saludpay:    CAMBIAR IP en el location /saludpay/
# ============================================================

upstream compra_backend {
    # <<< CAMBIAR IP:PUERTO de ms-compra >>>
    server 127.0.0.1:8082;

    # Para escalabilidad horizontal, agregar más instancias:
    # server 192.168.1.10:8082;
    # server 192.168.1.11:8082;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    location / {
        root /var/www/frontend-sps;
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    # ========================================================
    # ms-auth (Módulo 3) — autenticación JWT
    # ========================================================
    location /api/auth/ {
        # <<< CAMBIAR IP:PUERTO de ms-auth >>>
        proxy_pass http://127.0.0.1:8081/ws/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================================
    # ms-compra (Módulo 2) — planes y compras (load balanced)
    # ========================================================
    location /api/compra/ {
        proxy_pass http://compra_backend/ws/compra/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================================
    # ms-saludpay-frontend (Módulo 3) — interfaz de pagos .NET
    # ========================================================
    location /saludpay/ {
        # <<< CAMBIAR IP:PUERTO de ms-saludpay-frontend >>>
        proxy_pass http://127.0.0.1:5001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
