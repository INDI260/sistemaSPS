# ============================================================
#             IPs de los microservicios
# ============================================================
#   AuthServerSPS (ms-auth):       10.43.100.66:8081
#   AppServerSaludPay (backend):   10.43.100.66:5000
#   ms-compra:                     10.43.99.13:8082
#   ms-sns:                        10.43.99.13:8083
# ============================================================

upstream compra_backend {
    server 10.43.99.13:8082;

    # Para escalabilidad horizontal, agregar más instancias:
    # server 10.43.99.14:8082;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    location / {
        root /var/www/frontend-sps;
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    # ========================================================
    # ms-auth (Módulo 3) — autenticación JWT (AuthServerSPS)
    # ========================================================
    location /api/auth/ {
        proxy_pass http://10.43.100.66:8081/ws/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================================
    # ms-compra (Módulo 2) — planes y compras (load balanced)
    # ========================================================
    location /api/compra/ {
        proxy_pass http://compra_backend/ws/compra/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================================
    # ms-saludpay-frontend (Módulo 3) — interfaz de pagos .NET
    # ========================================================
    location /saludpay/ {
        # <<< CAMBIAR IP:PUERTO de ms-saludpay-frontend >>>
        proxy_pass http://10.43.100.66:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================================
    # ms-sns (Módulo 4) — validación SNS
    # ========================================================
    location /api/sns/ {
        proxy_pass http://10.43.99.13:8083/ws/sns/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
