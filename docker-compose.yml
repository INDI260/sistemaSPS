services:

  # ─────────────────────────────────────────
  # Base de datos ms-compra
  # ─────────────────────────────────────────
  db-compra:
    image: mysql:8.0
    container_name: sps-db-compra
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: db_compra
      MYSQL_USER: sps_compra
      MYSQL_PASSWORD: sps_compra_pass
    ports:
      - "3307:3306"
    volumes:
      - db-compra-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "--password=rootpass"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ─────────────────────────────────────────
  # Base de datos ms-sns
  # ─────────────────────────────────────────
  db-sns:
    image: mysql:8.0
    container_name: sps-db-sns
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: db_sns
      MYSQL_USER: sps_sns
      MYSQL_PASSWORD: sps_sns_pass
    ports:
      - "3308:3306"
    volumes:
      - db-sns-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "--password=rootpass"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ─────────────────────────────────────────
  # RabbitMQ (broker AMQP para SHC y SAM)
  # ─────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: sps-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: sps_user
      RABBITMQ_DEFAULT_PASS: sps_pass
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ─────────────────────────────────────────
  # Mock SNS (puerto 8083)
  # ─────────────────────────────────────────
  ms-sns:
    build:
      context: ./ms-sns
      dockerfile: Dockerfile
    image: sps/ms-sns:latest
    container_name: sps-ms-sns
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_SNS_URL: jdbc:mysql://db-sns:3306/db_sns?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_SNS_USER: sps_sns
      DB_SNS_PASS: sps_sns_pass
      SNS_TIEMPO_PROCESAMIENTO_MS: 15000
    ports:
      - "8083:8083"
    depends_on:
      db-sns:
        condition: service_healthy

  # ─────────────────────────────────────────
  # Servicio de Compra (puerto 8082)
  # ─────────────────────────────────────────
  ms-compra:
    build:
      context: ./ms-compra
      dockerfile: Dockerfile
    image: sps/ms-compra:latest
    container_name: sps-ms-compra
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_COMPRA_URL: jdbc:mysql://db-compra:3306/db_compra?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_COMPRA_USER: sps_compra
      DB_COMPRA_PASS: sps_compra_pass
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: sps_user
      RABBITMQ_PASS: sps_pass
      SNS_URL: http://ms-sns:8083
      SALUDPAY_URL: http://10.43.100.66:5000
      JWT_SECRET: supersecretkey256bitsminimum1234567890
      INTERNAL_API_KEY: internal-secret-key-sps
      TIMER_INTERVALO_MS: 10000
      MAX_INTENTOS_SNS: 10
      COMPRA_BASE_URL: http://10.43.99.13:8082
      MAIL_HOST: smtp-mail.outlook.com
      MAIL_PORT: 587
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
    ports:
      - "8082:8082"
    depends_on:
      db-compra:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ms-sns:
        condition: service_started

volumes:
  db-compra-data:
  db-sns-data:
  rabbitmq-data:
