version: '3.8'

services:

  # ─── Base de datos compartida ───────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: sps-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass123"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - sps-net

  # ─── ms-auth (Spring Boot WAR, :8081) ───────────────────────────────────────
  ms-auth:
    build:
      context: ./ms-auth
      dockerfile: Dockerfile
    container_name: sps-ms-auth
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DB_AUTH_URL: "jdbc:mysql://mysql:3306/db_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_AUTH_USER: sps_auth
      DB_AUTH_PASS: sps_pass
      JWT_SECRET: supersecretkey256bitsminimum1234567890
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sps-net

  # ─── ms-saludpay (ASP.NET Core 8 API, :5000) ────────────────────────────────
  ms-saludpay:
    build:
      context: ./ms-saludpay
      dockerfile: Dockerfile
    container_name: sps-ms-saludpay
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:5000"
      ConnectionStrings__SaludPayDb: "Server=mysql;Database=db_salud_pay;User=sps_saludpay;Password=sps_pass;"
      Jwt__Secret: saludpay-super-secret-key-min-256bits
      Jwt__ExpirySeconds: "3600"
      SPS__CompraCallbackUrl: "http://10.43.99.13:8082"
      SPS__InternalApiKey: internal-secret-key-sps
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sps-net

  # ─── ms-saludpay-frontend (ASP.NET Core 8 Razor, :5001) ────────────────────
  ms-saludpay-frontend:
    build:
      context: ./ms-saludpay-frontend
      dockerfile: Dockerfile
    container_name: sps-ms-saludpay-frontend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:5001"
      SaludPayApi__BaseUrl: "http://ms-saludpay:5000"
    depends_on:
      - ms-saludpay
    networks:
      - sps-net

  # ─── NGINX proxy (:80) ───────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: sps-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ms-auth
      - ms-saludpay-frontend
    networks:
      - sps-net

volumes:
  mysql_data:

networks:
  sps-net:
    driver: bridge
