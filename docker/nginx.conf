server {
    listen 80;

    # Frontend SaludPay → /saludpay/
    location /saludpay/ {
        proxy_pass         http://ms-saludpay-frontend:5001/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Cookie            $http_cookie;
    }

    # Auth API → /api/auth/
    location /api/auth/ {
        proxy_pass         http://ms-auth:8081/ws/auth/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization     $http_authorization;
    }

    # SaludPay API → /api/saludpay/
    location /api/saludpay/ {
        proxy_pass         http://ms-saludpay:5000/ws/saludpay/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization     $http_authorization;
    }

    location / {
        return 200 'Modulo 3 SPS activo';
        add_header Content-Type text/plain;
    }
}
