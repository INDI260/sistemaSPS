<div class="login-container">
  <div class="login-card">
    <h1>SPS</h1>
    <h2>Compra de Planes de Salud</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="cedula">Cédula</label>
        <input id="cedula" type="text" formControlName="cedula" placeholder="Ingrese su cédula" />
      </div>

      <div class="form-group">
        <label for="contrasena">Contraseña</label>
        <input id="contrasena" type="password" formControlName="contrasena" placeholder="Ingrese su contraseña" />
      </div>

      <button type="submit" class="btn-primary" [disabled]="loginForm.invalid || loading">
        {{ loading ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>
  </div>
</div>
